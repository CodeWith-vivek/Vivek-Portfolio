<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/images/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking first paint; text renders in the fallback font
         and swaps to DM Sans / JetBrains Mono when they arrive. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <meta name="theme-color" content="#060605" />
    <meta name="description" content="Vivek Anand, Full Stack Developer (AI / Generative AI) in Kochi, Kerala. TypeScript, React, Next.js, Node.js, PostgreSQL, RAG and LLM integration." />
    <script>
      // Apply saved theme before paint to avoid a flash; dark is the default.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        // Start fetching the hero's first frame alongside the JS bundle.
        ["frames/manifest.json", "frames/" + theme + "/f_000.webp"].forEach(function (href) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.href = "%BASE_URL%" + href;
          link.as = href.slice(-5) === ".json" ? "fetch" : "image";
          if (link.as === "fetch") link.crossOrigin = "anonymous";
          document.head.appendChild(link);
        });
        if (theme === "light") {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#f6f6f0");
        }
      })();
    </script>
    <title>Vivek Anand</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
